spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=ms-autenticacion
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MS-AUTENTICACION
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-usuarios
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MS-USUARIOS
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webflux.routes[2].id=ms-compromisos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://MS-COMPROMISOS
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/compromisos/**,/api/pagos/**

spring.cloud.gateway.server.webflux.routes[3].id=ms-incidencias
spring.cloud.gateway.server.webflux.routes[3].uri=lb://MS-INCIDENCIAS
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/incidencias/**

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*