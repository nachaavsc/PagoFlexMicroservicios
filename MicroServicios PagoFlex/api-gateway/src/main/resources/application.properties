spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=ms-autenticacion
spring.cloud.gateway.routes[0].uri=lb://ms-autenticacion
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=ms-usuarios
spring.cloud.gateway.routes[1].uri=lb://ms-usuarios
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.routes[2].id=ms-compromisos
spring.cloud.gateway.routes[2].uri=lb://ms-compromisos
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/compromisos/**

spring.cloud.gateway.routes[3].id=ms-incidencias
spring.cloud.gateway.routes[3].uri=lb://ms-incidencias
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/incidencias/**

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
